base: default.yaml
experiment: team4_bm25_claude-opus-5-5

llm:
  provider: anthropic             # anthropic | openai | vllm
  model: claude-opus-5-5
  client: {max_retries: 8}        # anthropic.AsyncAnthropic(...) kwargs; the key comes from ANTHROPIC_API_KEY
  request:                        # passed verbatim to client.beta.messages.create
    max_tokens: 16000             # keep <= 16K: requests are not streamed
    output_config: {effort: high}
    cache_control: {type: ephemeral}         # automatic prompt caching of the growing conversation
    betas: [server-side-fallback-2026-07-01]
    fallbacks: default                       # a declined request is re-run on Anthropic's recommended model
